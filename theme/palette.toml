# theme/palette.toml — the ONE place a colour is authored in Core.
# ──────────────────────────────────────────────────────────────────────────────
# Core is "themed in Tokyo Night". Until #679 that was a convention maintained by
# hand: ~90 hex literals across thirteen files in seven syntaxes, kept in step by
# COMMENTS ("kept in sync with starship.toml + tmux.conf @tn_*") that nothing
# checked. A hand-edit to one file was a valid, lintable, shippable change that
# fanned a half-recoloured stack out to nine repos.
#
# nvim never had the problem: it holds zero hex literals and asks the plugin
# (nvim/lua/gerrrt/utils/palette.lua). This file is that same idea for everything
# else — scripts/gen-theme.sh renders every consumer from the table below.
#
# TO CHANGE THE THEME, edit `style` and run `./scripts/gen-theme.sh --refresh`.
# That re-resolves the colours FROM the pinned tokyonight and rewrites every
# consumer. Selection is GENERATION-TIME: there is no runtime CORE_THEME, and
# none is planned — the consumers are static files (starship and lazygit read
# fixed config paths), and regenerating on a live box would dirty the vendored
# core/ tree that scripts/core-integrity.sh exists to keep pristine.
#
# NOT VENDORED. This is a generation-time INPUT, like scripts/modern-baseline.yml.
# Its OUTPUTS ship; it does not (audit-core.sh's META_ALLOWLIST).
#
# FLAT ON PURPOSE — no [tables]. gen-theme.sh reads this with one anchored awk
# regex and no TOML library, the same no-dependency discipline check-modern.sh
# applies to scripts/modern-baseline.yml. That is what lets the drift gate run on
# a bare box instead of skipping itself into uselessness.
# ──────────────────────────────────────────────────────────────────────────────
schema = 1

# ── provenance ────────────────────────────────────────────────────────────────
# source_commit mirrors nvim/lazy-lock.json's tokyonight pin. --refresh REFUSES to
# run against an installed plugin that is off this pin, so the table below is
# reproducible from the committed lock rather than from whatever a maintainer
# happens to have on disk. `style` must equal M.style in
# nvim/lua/gerrrt/utils/palette.lua — --refresh asserts that too, which is what
# finally makes that file's "keep the two in sync" comment a machine check.
style         = "storm"
source        = "folke/tokyonight.nvim"
source_commit = "cdc07ac78467a233fd62c493de29a17e0cf2b2b6"

# ── resolved colours — GENERATED by `gen-theme.sh --refresh`. Do not hand-edit ──
# These are tokyonight's RESOLVED table, not its source file: border_highlight,
# bg_visual and black are blended/darkened by the plugin's own init.lua and appear
# in no colors/*.lua. Alphabetical, so a style flip diffs as clean value changes.
# core:theme:gen palette-colors
color_bg                = "#24283b"
color_bg_dark           = "#1f2335"
color_bg_highlight      = "#292e42"
color_bg_visual         = "#2e3c64"
color_black             = "#1d202f"
color_blue              = "#7aa2f7"
color_blue1             = "#2ac3de"
color_border_highlight  = "#29a4bd"
color_comment           = "#565f89"
color_cyan              = "#7dcfff"
color_dark3             = "#545c7e"
color_fg                = "#c0caf5"
color_fg_dark           = "#a9b1d6"
color_green             = "#9ece6a"
color_magenta           = "#bb9af7"
color_magenta2          = "#ff007c"
color_orange            = "#ff9e64"
color_red               = "#f7768e"
color_red1              = "#db4b4b"
color_terminal_black    = "#414868"
color_yellow            = "#e0af68"
# core:theme:end palette-colors

# ── semantic roles — which token plays which part ─────────────────────────────
# Three files independently encoded "accent = blue, muted = comment"
# (zsh/05-ui.zsh, lib/ux.sh, zsh/60-update.zsh) and two encoded ok/err. Naming the
# ROLE lets a consumer say what it means, and lets prose name a token instead of
# repeating a hex — the rule that keeps zsh/00-tools.zsh's separator paragraph
# from drifting away from the code it describes.
role_accent = "blue"
role_muted  = "comment"
role_ok     = "green"
role_err    = "red"
role_rule   = "terminal_black"

# ── 256-colour fallbacks — HAND-CHOSEN. --refresh never touches these ──────────
# Used when $COLORTERM does not advertise 24-bit. NOT derivable from the hex
# above: they are eyeballed cube approximations, and a nearest-colour computation
# does not reproduce them. Two forms because Core renders colour two ways — raw
# SGR (\e[38;5;Nm) and zsh prompt specs (%F{N}) — which is why there are four
# numbers and not two. They live OUTSIDE the generated block deliberately: a
# style change requires a human to re-pick them and say so in the commit.
fallback_accent_sgr  = 111
fallback_muted_sgr   = 103
fallback_accent_spec = 75
fallback_muted_spec  = 244
