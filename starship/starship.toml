"$schema" = 'https://starship.rs/config-schema.json'

# command_timeout: the ceiling (ms) starship waits for ANY external command it
# runs to render a segment — the git_* modules (git_status/branch/commit/state)
# and every [custom] command — before it abandons the call AND kills the child.
# starship's built-in default is 500ms; we pin it EXPLICITLY (and a touch higher)
# for two reasons:
#   • Correctness: a `git status` on a big or cold repo can legitimately take
#     >500ms, and the default would blank the git segment mid-work. 1300ms clears
#     that on real repos without feeling laggy.
#   • Reaping: the timeout is also the SAFETY VALVE. When a git call wedges — a
#     stale .git/index.lock, a repo on a slow \\wsl$ / network path, a hung
#     credential probe — starship stops waiting and terminates the child at this
#     bound instead of leaving it running. On Windows especially, an un-reaped
#     git child orphans, and one per prompt render piles up into hundreds of
#     stuck git.exe (enough that scoop/winget then can't replace the in-use
#     git binary to update it). Bounding + killing here is what stops the pile.
# The OS layer complements this: the Windows host also makes shell-spawned git
# fail fast instead of block on an auth prompt (see dotfiles-Windows pwsh core).
command_timeout = 1300

# No blank line above each prompt: the command-block rules (zsh 00-tools.zsh) now
# own block separation, and transient collapse looks tighter without the leading gap.
add_newline = false

# dotfiles-* :: starship prompt  (tokyonight-storm — bold minimal-left revision)
# ──────────────────────────────────────────────────────────────────────────────
# LAYOUT: the LEFT prompt is a single srf1 capsule of always-present context —
# os · user · directory · git — with the ❖ input char on a second line. Languages,
# the ops band (docker/k8s/aws/conda/direnv/jobs) and shell/duration/memory live in
# right_format as a matching srf1 capsule at the far right. $time was dropped (tmux +
# sketchybar own the clock). The whole prompt sits on ONE surface (srf1) — the old
# srf1/srf2 two-tone stepping was flattened for a seamless look; set a module's `bg:`
# back to color_srf2 to restore depth. Colors are TEXT/ICON accents: os→blue ·
# user→purple · dir→yellow · git→green/orange · languages→aqua · ops→purple/orange.
# Transient collapse + command-block rules are wired in zsh (00-tools/45-plugins).)

format = """
[](fg:color_srf1)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
[](fg:color_srf1)\
$line_break$status$character$sudo"""

right_format = """
[](fg:color_srf1)\
$c$cpp$rust$golang$nodejs$bun$php$java$kotlin$haskell$python$ruby$lua$package\
$container$docker_context$kubernetes$aws$conda$pixi$direnv$env_var$custom$jobs$shlvl\
$shell$cmd_duration$memory_usage\
[](fg:color_srf1)\
"""

continuation_prompt = "[∙](fg:color_comment)" # the > > on multi-line input

palette = 'tokyonight_storm'

[palettes.tokyonight_storm]
# ── accents — now used as TEXT, not as fills ──────────────────────────────────
color_fg0 = '#c0caf5'     # fg (brightest text)
color_fg_dark = '#a9b1d6' # softer text (quiet segments)
color_blue = '#7aa2f7'
color_aqua = '#7dcfff'    # cyan
color_green = '#9ece6a'
color_orange = '#ff9e64'
color_purple = '#bb9af7'  # magenta
color_red = '#f7768e'
color_yellow = '#e0af68'
color_comment = '#565f89' # muted / de-emphasized
# ── surfaces — the two dark segment fills (subtle stepped depth) ──────────────
color_srf1 = '#24283b' # storm bg, slightly raised above the terminal
color_srf2 = '#1f2335' # bg_dark, a touch deeper

[os]
disabled = false
style = "bg:color_srf1 fg:color_blue"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
EndeavourOS = " "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Pop = " "

[username]
show_always = true
style_user = "bg:color_srf1 fg:color_purple"
style_root = "bg:color_srf1 fg:color_red"    # root stands out (kept readable, not a fill)
format = '[$user ]($style)'

# ── Context awareness (bold-refresh additions) ──────────────────────────────────
# hostname: silent locally (ssh_only), ORANGE on a remote box so an SSH session is
#   impossible to miss. Rides the left identity capsule, right after $username.
[hostname]
ssh_only = true
style = "fg:color_orange bg:color_srf1"
format = '[@$hostname ]($style)'

# container: a red hexagon when the shell is INSIDE a container (docker/podman/etc.) —
#   "know your sandbox". Symbol-only for the minimal look; add $name for which-container.
[container]
style = "fg:color_red bg:color_srf1"
format = '[ $symbol ]($style)'

# shlvl: shell-nesting depth, shown only past threshold 3 (normal terminal->tmux->zsh
#   stays silent; ssh->container->shell lights it up). Dim, on the right ops band.
[shlvl]
disabled = false
threshold = 3
symbol = "↕"
style = "fg:color_comment bg:color_srf1"
format = '[ $symbol$shlvl ]($style)'

[directory]
style = "fg:color_yellow bg:color_srf1"
format = '[ $path ]($style)'
truncation_length = 4
truncation_symbol = "…/"
read_only = "󰌾 "                                          # NEW vs your config: lock icon in read-only dirs
read_only_style = "fg:color_red bg:color_srf1"
repo_root_style = "bold fg:color_yellow bg:color_srf1"    # make the git-root segment pop
before_repo_root_style = "fg:color_comment bg:color_srf1"
# When repo_root_style is set, starship renders the path via repo_root_format
# (NOT `format` above) — and the built-in default ends with a literal unstyled
# trailing space, which showed up as a blank hole between directory and git on
# the powerline. Redefine it here without that trailing space, and pad the
# leading edge inside a bg:color_srf1 span so the bar stays continuous.
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = "󰘬 "
style = "fg:color_green bg:color_srf1"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "fg:color_orange bg:color_srf1"
format = '([ $all_status $ahead_behind ]($style))'

# Added/deleted line counts (+12 -3) on the same srf1 git band, after status. Green/red
# text matching git's own diff colors. only_nonzero_diffs keeps it silent in a clean tree,
# so the segment only appears once you've actually changed something.
[git_metrics]
disabled = false
added_style = "fg:color_green bg:color_srf1"
deleted_style = "fg:color_red bg:color_srf1"
format = '([ +$added ]($added_style))([ -$deleted ]($deleted_style))'

# Short commit hash, shown ONLY in detached-HEAD state (only_detached = true) so
# a `git checkout <sha>`/`<tag>` no longer leaves the git band misleadingly blank.
# Green text to read as a sibling of the branch, on the same srf1 surface.
[git_commit]
only_detached = true
tag_disabled = false                                              # also surface an exact tag (e.g. v1.2.0) when on one
tag_symbol = "󰓹 "
style = "bg:color_srf1"
format = '[[ $hash $tag ](fg:color_green bg:color_srf1)]($style)'

# Mid-operation state (REBASING 2/8, MERGING, CHERRY-PICKING…). Red text so an
# in-progress rebase/merge is impossible to miss; sits in the same srf1 git band
# between branch and status, and only appears when an operation is underway.

[git_state]
style = "bg:color_srf1"
format = '[[ $state ($progress_current/$progress_total) ](fg:color_red bg:color_srf1)]($style)'

[nodejs]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[bun]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[c]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[cpp]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[rust]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[golang]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[php]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[java]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[kotlin]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[haskell]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[python]
symbol = " "
style = "bg:color_srf1"
# Show the active virtualenv/venv name next to the version. The previous format
# was version-only, so a plain `python -m venv .venv && activate` project showed
# nothing about the env you're in. `(...)` is an optional group that renders ONLY
# when a venv is active, so a bare interpreter stays clean. venv name in purple.
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)([\($virtualenv\) ](fg:color_purple bg:color_srf1))'

# Project package version indicator (package.json / Cargo.toml / pyproject / etc.)
# - the "package indicator" next to the language segments. Renders only inside a
# package directory, so it's silent elsewhere. Aqua, on the language surface.
[package]
symbol = "󰏗 "
style = "bg:color_srf1"
format = '[[ $symbol$version ](fg:color_aqua bg:color_srf1)]($style)'

[docker_context]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($context) ](fg:color_purple bg:color_srf1)]($style)'

# ── [custom]: the real power — any command becomes a segment ──────────────────
# Show the active VPN/tunnel interface (matches the tmux-netinfo idea).
# OS-GATED so the single canonical file is safe on Windows too: `ifconfig` is
# Unix-only, and on Windows starship would run the probe EVERY prompt and hit
# command_timeout (a noisy `custom command … timed out` WARN). A custom module's
# `os` takes ONE value (linux|macos|windows — there is no "unix"/negation), so the
# same probe is declared once per Unix OS; Windows matches neither and never runs it.
# macOS uses ifconfig (native there); Linux uses the PORTABLE `ip link show` form —
# supported by BOTH iproute2 AND BusyBox's `ip` applet (Alpine's default userland), so it
# works on every Linux target including the BusyBox outlier. It parses the interface name +
# the UP flag (no `-o`/`show up`, which BusyBox `ip` lacks). net-tools/ifconfig is NOT
# installed by default on modern distros, so an ifconfig probe would silently never fire
# there. A box lacking the probe binary just fast-fails and the segment hides — no timeout,
# unlike Windows.
# -- OPT-IN: live Docker engine version (OFF by default - perf) --------------
# docker_context above is the cheap STATUS (which daemon/context). A live VERSION
# means shelling out to the daemon every prompt in a Docker dir; command_timeout
# bounds it, but it can still add latency. Uncomment to enable:
# [custom.docker_version]
# description = "docker engine version"
# command = "docker version --format '{{.Server.Version}}'"
# when = "docker info"
# detect_files = ['Dockerfile', 'docker-compose.yml', 'docker-compose.yaml', 'compose.yaml']
# symbol = "󰡨 "
# style = "fg:color_purple bg:color_srf1"
# format = '[ $symbol$output ]($style)'

[custom.vpn_macos]
description = "active tunnel interface (macOS)"
os = "macos"
command = "ifconfig | awk '/^(utun|wg|tun)/{print $1; exit}' | tr -d ':'"
when = "ifconfig | grep -qE '^(utun|wg|tun)'"
symbol = "󰦝 "
style = "fg:color_purple bg:color_srf1"
format = '[ $symbol $output ]($style)'
[custom.vpn_linux]
description = "active tunnel interface (Linux)"
os = "linux"
command = "ip link show 2>/dev/null | awk -F'[ :]+' '$2 ~ /^(wg|tun|utun|proton|tailscale|nordlynx)/ && $3 ~ /(<|,)UP(,|>)/ {print $2; exit}'"
when = "ip link show 2>/dev/null | awk -F'[ :]+' '$2 ~ /^(wg|tun|utun|proton|tailscale|nordlynx)/ && $3 ~ /(<|,)UP(,|>)/ {found=1} END{exit !found}'"
symbol = "󰦝 "
style = "fg:color_purple bg:color_srf1"
format = '[ $symbol $output ]($style)'
# Other classic [custom] uses: gcloud project, terraform workspace, 1Password
# account, current Burp/engagement tag from an env var, etc.

# Kubernetes context (+ namespace) on the srf1 ops band, cyan text. GATED on real k8s
# project markers (Helm charts, kustomize, skaffold, a k8s/ dir, or an explicit
# KUBECONFIG export) — without detect_* config starship would render this in EVERY
# directory that has a current context, which is noise. context_aliases can shorten
# long ARNs/GKE names; add your clusters there as needed.
[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bg:color_srf1"
format = '[[ $symbol $context (\($namespace\)) ](fg:color_aqua bg:color_srf1)]($style)'
detect_files = ['Chart.yaml', 'skaffold.yaml', 'kustomization.yaml']
detect_folders = ['k8s', '.helm', 'manifests']
detect_env_vars = ['KUBECONFIG']
# [kubernetes.context_aliases]
# "arn:aws:eks:us-east-1:123456789:cluster/prod" = "prod"

[aws]
symbol = "󰸏 "
style = "fg:color_orange bg:color_srf1"
format = '[ $symbol ($profile) (\($region\)) ]($style)'
# disabled by default elsewhere; shows AWS_PROFILE/region when set

[env_var.ENGAGEMENT] # show a custom env var when present (e.g. client tag)
variable = "ENGAGEMENT"
symbol = "🎯 "
style = "fg:color_red bg:color_srf1"
format = '[ $symbol $env_value ]($style)'


# WSL indicator - shows the distro name when this shell is running inside WSL
# (WSL_DISTRO_NAME is exported by WSL). Silent on the native Windows host and on
# bare Linux/macOS. Blue, on the ops surface. Both env_var modules render via the
# $env_var slot wired into `format`.
[env_var.WSL]
variable = "WSL_DISTRO_NAME"
symbol = "󰌽 "
style = "fg:color_blue bg:color_srf1"
format = '[ $symbol$env_value ]($style)'
[conda]
style = "bg:color_srf1"
format = '[[ $symbol ($environment) ](fg:color_purple bg:color_srf1)]($style)'

[pixi]
style = "bg:color_srf1"
format = '[[ $symbol($version) ($environment) ](fg:color_purple bg:color_srf1)]($style)'

# direnv state on the srf1 band — you hook direnv in os/macos.zsh but had no visual
# feedback that an .envrc was loaded vs. waiting for `direnv allow`. Yellow when allowed
# & loaded, red when blocked/denied so an un-allowed .envrc is obvious. Only renders in a
# directory under direnv's control (an .envrc up the tree).
[direnv]
disabled = false
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol $loaded ](fg:color_yellow bg:color_srf1)]($style)'
loaded_msg = "on"
unloaded_msg = "off"
allowed_msg = " "
not_allowed_msg = "󰍷 "
denied_msg = " "

# ruby + lua are declared in mise/config.toml as global runtimes, so they belong
# in the language band alongside the rest. Same cyan-on-srf2 treatment. (Section
# order here is irrelevant — the `format` string at the top controls layout.)
[ruby]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

[lua]
symbol = " "
style = "bg:color_srf1"
format = '[[ $symbol($version) ](fg:color_aqua bg:color_srf1)]($style)'

# How long the last command took (only when it exceeds min_time). Lives in the
# RIGHT prompt (see right_format) — same srf1 surface as the rest of that pill,
# orange text so slow commands gently announce themselves. Transient: vanishes
# after a quick command. starship passes --cmd-duration to `prompt --right`, so
# it renders correctly on the right side.
[cmd_duration]
min_time = 500
style = "fg:color_orange bg:color_srf1"
format = '[ 󰔛 $duration ]($style)'
# Background job count (`&`, Ctrl-Z). Purple text, srf1 surface; only shows when
# at least one job is running.
[jobs]
symbol = '+'
symbol_threshold = 1
number_threshold = 1
style = "bg:color_srf1"
format = '[[ $symbol $number ](fg:color_purple bg:color_srf1)]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:color_comment bg:color_srf1"
format = '[ $time ]($style)'

# ── RIGHT prompt modules: shell · cmd_duration · memory_usage ────────────────
# (battery removed — it's already in the tmux status bar. cmd_duration is
# configured above, in its original spot; section order is irrelevant.)
[shell]
disabled = false
style = "fg:color_comment bg:color_srf1"
zsh_indicator = "zsh"
# Cross-shell: zsh is the daily driver, but dotfiles-Windows syncs THIS file verbatim
# (see its starship-sync.ps1) and runs starship under PowerShell — so label that shell
# too. Benign on zsh: starship only renders the indicator matching the active shell.
powershell_indicator = "pwsh"
format = '[ $indicator ]($style)'

[memory_usage]
disabled = false
threshold = 50                          # only show when RAM > 50%
symbol = "󰍛 "
style = "fg:color_purple bg:color_srf1"
format = '[ $symbol $ram_pct ]($style)'

[sudo]
disabled = false               # shows a marker while sudo creds are cached
symbol = "󱐋 "
style = "fg:color_yellow"
format = '[ $symbol ]($style)'

[line_break]
disabled = false

# Exit code of the last command, on the prompt line (no powerline surface — the
# ridge has already ended). success_symbol is empty, so this renders NOTHING on
# success and only speaks up on failure, complementing the red character arrow
# with the actual code/reason: 127 → not found, 126 → not executable, SIGINT on
# Ctrl-C, SIGKILL on an OOM, etc. pipestatus breaks down which stage of a
# `a | b | c` pipeline failed.
[status]
disabled = false
style = "fg:color_red"
symbol = "✘ "
not_executable_symbol = "🚫 "
not_found_symbol = "🔍 "
sigint_symbol = "🧱 "
signal_symbol = "⚡ "
recognize_signal_code = true
map_symbol = true
pipestatus = true
pipestatus_separator = '[|](fg:color_comment)'
format = '[ $symbol $common_meaning $signal_name $maybe_int ]($style)'
pipestatus_format = '[ $pipestatus]($style)=>[ $symbol $common_meaning $signal_name $maybe_int]($style)'

[character]
disabled = false
success_symbol = '[❖ ](bold fg:color_green)'
error_symbol = '[❖ ](bold fg:color_red)'
vimcmd_symbol = '[ ](bold fg:color_orange)'
vimcmd_replace_one_symbol = '[ ](bold fg:color_purple)'
vimcmd_replace_symbol = '[ ](bold fg:color_purple)'
vimcmd_visual_symbol = '[ ](bold fg:color_yellow)'
